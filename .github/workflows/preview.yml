name: preview

# Publishes the browser version of the phone app (real screens over demo data, no server) to
# GitHub Pages: main at /bolusi/, each open PR at /bolusi/pr-preview/pr-<n>/. See docs/previews.md.
# The build (which runs the dependencies' install scripts) gets a read-only token; only the deploy
# job, which runs no project code, may write to gh-pages and comment on the PR.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A fork's token cannot push to gh-pages; a closed PR only has its preview removed.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}${{ github.event_name == 'pull_request' && format('/pr-preview/pr-{0}', github.event.number) || '' }}
          EXPO_PUBLIC_PREVIEW_LABEL: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }}"
        run: |
          export EXPO_PUBLIC_PREVIEW_LABEL="$EXPO_PUBLIC_PREVIEW_LABEL · ${SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC')"
          pnpm --filter @bolusi/mobile build:web
          # Pages runs Jekyll otherwise, which drops the bundle's `_expo/` folder.
          touch apps/mobile/dist/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: apps/mobile/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    # Also runs when the build was skipped because the PR closed, to remove its preview.
    if: >-
      !cancelled() && !failure() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BUILD: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    steps:
      # The deploy actions work in a checkout of this repository; they push with their own token.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: env.BUILD == 'true'
        with:
          name: preview-site
          path: apps/mobile/dist

      - name: Deploy main
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: apps/mobile/dist
          branch: gh-pages
          clean-exclude: pr-preview/
          # Rebase instead of force-push so a PR preview deployed meanwhile survives.
          force: false

      # The root `.nojekyll` normally comes with main's deploy; a PR preview may come first.
      - name: Keep Jekyll off the Pages branch
        if: github.event_name == 'pull_request' && env.BUILD == 'true'
        run: mkdir -p pages-root && touch pages-root/.nojekyll
      - if: github.event_name == 'pull_request' && env.BUILD == 'true'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: pages-root
          branch: gh-pages
          clean: false
          force: false

      - name: Deploy or remove PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: apps/mobile/dist
          preview-branch: gh-pages
