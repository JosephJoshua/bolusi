name: desktop-release

# Publishes the counter PC app: push a tag like desktop-v0.2.0 and the installer, its blockmap and
# latest.yml go to a GitHub Release of that tag. Installed apps check the latest release and update
# themselves. The tag's version must match apps/desktop/package.json.
on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          if ("desktop-v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match apps/desktop/package.json version $version"
          }
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      # The server the installed app syncs with is baked in at build time (repository variable).
      # An installed app only syncs over HTTPS (src/main/server-address.ts).
      - name: Check the server address is set and https
        shell: pwsh
        run: |
          if (-not $env:BOLUSI_API_URL) { throw 'Set the BOLUSI_API_URL repository variable' }
          if ($env:BOLUSI_API_URL -notmatch '^https://[^/\s]') { throw 'BOLUSI_API_URL must be an https:// address' }
        env:
          BOLUSI_API_URL: ${{ vars.BOLUSI_API_URL }}
      - run: pnpm --filter @bolusi/desktop run build
        env:
          BOLUSI_API_URL: ${{ vars.BOLUSI_API_URL }}
      - run: pnpm --filter @bolusi/desktop exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
