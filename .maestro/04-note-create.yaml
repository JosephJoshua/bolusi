# Note create journey (task 201-B; promoted from pending-119). Precondition: an unlocked session on the
# live notes surface — delegated to subflows/unlock.yaml. This flow's created note also seeds the archive
# flow (05), which runs after it and does not clearState.
#
# Journey: list -> create -> fill title/body -> save -> the new note appears in the list. testIDs are the
# notes module's own (NoteEditor.tsx / NotesList.tsx): the create affordance on an EMPTY list is the
# empty-state CTA `ui.emptyState.cta` (NotesList renders the bottom-action `notes.list.create` button only
# once rows exist), then `notes.editor.title|body|save` and `notes.list.items`. Text entry targets the
# inner `${testID}.field` RN input
# (packages/ui/src/components/TextInput.tsx).
appId: com.bolusi.app
tags:
  - live
  - notes
---
- runFlow: subflows/unlock.yaml
- assertVisible:
    id: 'notes.list'
- takeScreenshot:
    path: note-01-list
- tapOn:
    id: 'ui.emptyState.cta'
- assertVisible:
    id: 'notes.editor'
- tapOn:
    id: 'notes.editor.title.field'
- inputText: 'Stok kiriman pagi'
- tapOn:
    id: 'notes.editor.body.field'
- inputText: 'Terima 12 dus, 2 rusak.'
- takeScreenshot:
    path: note-02-editor-filled
# NB: no attach step here. Tapping `notes.editor.attach` pushes the camera capture screen (capture-screen /
# "Ambil Foto"), which sits on a loading spinner forever on a headless AVD with no camera — the editor and
# its save button are then off-screen and the flow can never reach save. Media capture is exercised on the
# media pipeline's own surface (task 82), not this note-create journey; here we only create + save so flow
# 05 has a note to archive.
- tapOn:
    id: 'notes.editor.save'
- assertVisible:
    id: 'notes.list.items'
- takeScreenshot:
    path: note-04-saved
