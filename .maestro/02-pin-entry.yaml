# The PIN-unlock proof (task 201-B; promoted from pending-119). Standalone and explicit — it drives the
# pad key-by-key rather than delegating to subflows/unlock.yaml, so it is the first-class evidence that a
# correct PIN unlocks the session; the downstream flows (03-06) reuse the subflow form of the same hop.
#
# Precondition: 01 has enrolled the device against the lane server. This flow does NOT clearState, so it
# inherits that enrolled state; a cold launch of an enrolled device with no open session resolves to the
# switcher (apps/mobile/src/navigation/zone.ts).
appId: com.bolusi.app
tags:
  - live
  - pin
---
- launchApp
# The user switcher (SwitcherScreen.tsx). `switcher-user-.*` regex taps the first enrolled user
# regardless of id (ids are UUIDv7, not known ahead of time).
- assertVisible:
    id: 'switcher-screen'
- takeScreenshot:
    path: pin-01-switcher
- tapOn:
    id: 'switcher-user-.*'
# The PIN pad (PinScreen.tsx -> ui/PinPad.tsx). Keys are `pin-pad.key.<digit>`.
- assertVisible:
    id: 'pin-screen'
- assertVisible:
    id: 'pin-pad'
- takeScreenshot:
    path: pin-02-pad
- tapOn:
    id: 'pin-pad.key.3'
- tapOn:
    id: 'pin-pad.key.1'
- tapOn:
    id: 'pin-pad.key.4'
- tapOn:
    id: 'pin-pad.key.1'
- tapOn:
    id: 'pin-pad.key.5'
- tapOn:
    id: 'pin-pad.key.9'
# On a correct PIN the gate opens the session and the home route renders the live notes surface. The six
# digits ARE the lane-seeded owner PIN (LANE_PIN = '314159', packages/harness/src/harness-provision.ts):
# the value the enroll bundle carries, so typing it actually unlocks. onComplete fires on the 6th digit
# (PIN_LENGTH = 6, packages/ui/src/components/PinPad.tsx) — not the 4th. Any other sequence lands the pad
# in its `wrong` state, and this assert never sees notes.list — the flow binds these digits to what the
# lane seeds.
- assertVisible:
    id: 'notes.list'
- takeScreenshot:
    path: pin-03-unlocked
