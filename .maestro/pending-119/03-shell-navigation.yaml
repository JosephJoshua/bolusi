# PENDING task 119 (live session shell) — NOT run by CI (see 02-pin-entry.yaml's header for why).
#
# Precondition once 119 lands: an ACTIVE device with an OPEN session -> resolveZone returns
# { kind: 'shell', route: 'home' }. Today Root.tsx passes `session={null}`, so the shell is
# unreachable in the running app.
#
# The home surface has two shapes (App.tsx): the empty shell (testID `shell-home`) when no
# `NotesRuntime` is injected, and the notes module surface (testID `notes.list`) once task 119 wires
# a live session-scoped runtime. The header chrome (sync chip + settings chip + avatar) renders ONLY
# on the notes surface — `props.notes !== undefined && currentUser !== null` (App.tsx) — so this flow
# asserts `notes.list` before tapping the chrome: on the empty `shell-home` there is nothing to tap,
# and a missing runtime should fail here with a legible assert, not a `tapOn` timeout.
#
# The chrome affordances carry testIDs now (the earlier KNOWN GAP is closed):
#   - the sync chip is `ui.syncChip` (SyncChip default testID, App.tsx) -> `sync-status-screen`;
#   - the settings entry is its OWN chip, `shell-open-settings` (App.tsx) -> `settings-screen`.
# NOTE the avatar (`ui.avatarButton`) is NOT the settings affordance — it opens the user switcher, not
# Settings; the two used to be conflated in this file's stale note.
appId: com.bolusi.app
tags:
  - pending-119
  - shell
---
- launchApp
- assertVisible:
    id: 'bolusi-app-shell'
# The chrome-bearing surface: chip + avatar render only here (not on the empty `shell-home`).
- assertVisible:
    id: 'notes.list'
- takeScreenshot:
    path: shell-01-home
# Sync chip -> Sync Status screen, then hardware back to home.
- tapOn:
    id: 'ui.syncChip'
- assertVisible:
    id: 'sync-status-screen'
- takeScreenshot:
    path: shell-02-sync-status
- back
# Settings chip -> Settings screen (its own affordance, not the avatar).
- tapOn:
    id: 'shell-open-settings'
- assertVisible:
    id: 'settings-screen'
- takeScreenshot:
    path: shell-03-settings
