# PENDING task 119 (live session shell) — NOT run by CI (see 02-pin-entry.yaml's header for why).
#
# Precondition once 119 lands: an in-session device can reach Settings (SettingsScreen.tsx), which is
# a shell route behind an open session. Today Root.tsx passes `session={null}`, so Settings — and the
# locale toggle on it — is unreachable in the running app.
#
# Journey: home -> Settings -> switch locale id <-> en -> the active-locale marker follows. This is the
# i18n toggle the task calls out (07-i18n). Settings' own testIDs: `settings-locale-<locale>` and
# `settings-locale-active-<locale>`.
#
# Reaching Settings is a real in-app hop now (the earlier KNOWN GAP is closed): the notes surface's
# `shell-open-settings` chip (App.tsx) navigates to `settings-screen`. This flow does that hop rather
# than assuming a deep link — it asserts the chrome-bearing `notes.list` surface, taps the settings
# chip, and only then drives the locale toggle.
appId: com.bolusi.app
tags:
  - pending-119
  - settings
  - i18n
---
- launchApp
- assertVisible:
    id: 'bolusi-app-shell'
# The settings chip lives on the notes surface (not the empty `shell-home`); assert it before tapping.
- assertVisible:
    id: 'notes.list'
- tapOn:
    id: 'shell-open-settings'
- assertVisible:
    id: 'settings-screen'
- takeScreenshot:
    path: i18n-01-settings
# Switch to English, assert the active marker moved to en.
- tapOn:
    id: 'settings-locale-en'
- assertVisible:
    id: 'settings-locale-active-en'
- takeScreenshot:
    path: i18n-02-en
# Switch back to Indonesian (the shop's default), assert the active marker moved to id.
- tapOn:
    id: 'settings-locale-id'
- assertVisible:
    id: 'settings-locale-active-id'
- takeScreenshot:
    path: i18n-03-id
